<!DOCTYPE html>
<html lang="{{ .Site.Language.Locale }}">
{{ partial "head.html" . }}

<body>
  <article class="posts">
    <div class="row">
      <div class="col-xs-12">
        {{ partial "header.html" . }}

        <div class="search-page" id="search"></div>
        <script>
          window.addEventListener('DOMContentLoaded', function () {
            new PagefindUI({
              element: '#search',
              showImages: false,
              showSubResults: true,
              resetStyles: false,
              translations: {
                placeholder: '{{ i18n "searchPlaceholder" }}'
              }
            });
          });
        </script>

        {{ partial "footer.html" . }}
      </div>
    </div>
  </article>

  {{ partial "scripts.html" . }}
</body>
</html>
